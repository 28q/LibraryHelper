<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Library Copybook</title>

<style>
*{box-sizing:border-box}

:root{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#18181b;
  background:#f4f4f5;
}

body{
  margin:0;
}

button,input,textarea{
  font:inherit;
}

/* ==============================
   Editor
   ============================== */

.app{
  display:grid;
  grid-template-columns:minmax(360px,480px) 1fr;
  min-height:100vh;
}

.panel{
  padding:20px;
  background:#fff;
  border-right:1px solid #ddd;
  overflow:auto;
  height:100vh;
  position:sticky;
  top:0;
}

.panel h1{
  font-size:20px;
  margin:0 0 18px;
}

label{
  display:block;
  font-size:12px;
  font-weight:700;
  margin:14px 0 5px;
}

input,textarea{
  width:100%;
  border:1px solid #ccc;
  border-radius:6px;
  padding:8px;
}

textarea{
  resize:vertical;
  font-family:
    ui-monospace,
    SFMono-Regular,
    Consolas,
    "Liberation Mono",
    monospace;
  font-size:12px;
  line-height:1.45;
  tab-size:4;
}

#description{
  min-height:100px;
}

#source{
  min-height:320px;
}

#cppHash{
  min-height:330px;
  background:#fafafa;
}

.row{
  display:flex;
  gap:8px;
  align-items:end;
}

.row>div{
  flex:1;
}

.buttons{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}

button{
  border:1px solid #bbb;
  background:#fafafa;
  border-radius:6px;
  padding:8px 12px;
  cursor:pointer;
}

button:hover{
  background:#eee;
}

.primary{
  background:#18181b;
  color:#fff;
  border-color:#18181b;
}

.primary:hover{
  background:#333;
}

/* ==============================
   Preview
   ============================== */

.preview-wrap{
  padding:25px;
  overflow:auto;
}

.sheet{
  width:210mm;
  min-height:297mm;
  margin:auto;
  background:#fff;
  box-shadow:0 2px 14px #0002;
  padding:10mm;
}

.print-title{
  font-size:20pt;
  margin:0 0 3mm;
}

.meta{
  font-family:
    ui-monospace,
    SFMono-Regular,
    Consolas,
    monospace;
  font-size:8pt;
  color:#555;
  margin-bottom:5mm;
}

.description{
  white-space:pre-wrap;
  font-size:9.5pt;
  line-height:1.55;
  margin-bottom:6mm;
}

/* ==============================
   Library code
   ============================== */

.code-block{
  border-top:1px solid #bbb;
  margin:0;
  padding:1.2mm 0 1.8mm;
  break-inside:avoid;
}

.block-head{
  display:flex;
  justify-content:space-between;
  gap:8px;

  font-family:
    ui-monospace,
    SFMono-Regular,
    Consolas,
    monospace;

  font-size:7pt;
  color:#555;
  margin-bottom:.8mm;
}

.hash{
  white-space:nowrap;
  font-weight:700;
}

.lines{
  font-family:
    ui-monospace,
    SFMono-Regular,
    Consolas,
    "Liberation Mono",
    monospace;

  line-height:1.32;
  tab-size:4;
}

.code-line{
  display:grid;
  grid-template-columns:4.5em 1fr;
  min-height:1.32em;
}

.ln{
  text-align:right;
  padding-right:1em;
  color:#999;
  user-select:none;
}

.src{
  white-space:pre;
  overflow:visible;
}

/* ==============================
   Hash checker preview
   ============================== */

#hashPrint{
  margin-top:16mm;
  padding-top:8mm;
  border-top:2px solid #ddd;
}

.hash-desc{
  font-size:9pt;
  line-height:1.5;
  margin-bottom:4mm;
}

.hash-code{
  margin:0;
  padding:3mm;
  border:1px solid #bbb;
  background:#fafafa;

  font-family:
    ui-monospace,
    SFMono-Regular,
    Consolas,
    "Liberation Mono",
    monospace;

  font-size:7.4pt;
  line-height:1.3;
  white-space:pre-wrap;
}

/* ==============================
   Print
   ============================== */

@page{
  size:A4 portrait;
  margin:8mm;
}

@media print{
  body{
    background:#fff;
  }

  .panel{
    display:none!important;
  }

  .app{
    display:block;
  }

  .preview-wrap{
    padding:0;
  }

  .sheet{
    width:auto;
    min-height:0;
    margin:0;
    padding:0;
    box-shadow:none;
  }

  body.print-source #hashPrint{
    display:none!important;
  }

  body.print-hash #sourcePrint{
    display:none!important;
  }

  body.print-hash #hashPrint{
    margin:0;
    padding:0;
    border:0;
  }
}

/* ==============================
   Mobile
   ============================== */

@media(max-width:900px){
  .app{
    display:block;
  }

  .panel{
    height:auto;
    position:static;
    border-right:0;
    border-bottom:1px solid #ddd;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="panel">

    <h1>Library Copybook</h1>

    <label for="title">ライブラリ名</label>
    <input
      id="title"
      value="Library Name"
    >

    <label for="description">説明</label>
    <textarea
      id="description"
      placeholder="アルゴリズム、使い方、計算量、注意点など"
    ></textarea>

    <div class="row">

      <div>
        <label for="blockSize">チェック間隔</label>
        <input
          id="blockSize"
          type="number"
          min="1"
          max="100"
          value="10"
        >
      </div>

      <div>
        <label for="fontSize">コード文字サイズ (pt)</label>
        <input
          id="fontSize"
          type="number"
          min="5"
          max="14"
          step=".25"
          value="8"
        >
      </div>

    </div>

    <label for="source">元コード</label>

    <textarea
      id="source"
      spellcheck="false"
      placeholder="ここにライブラリコードを貼り付け"
    ></textarea>

    <div class="buttons">
      <button id="update">
        更新
      </button>

      <button
        id="printSource"
        class="primary"
      >
        ライブラリを印刷 / PDF
      </button>
    </div>

    <label for="cppHash">
      C++ Hash Checker
    </label>

    <textarea
      id="cppHash"
      readonly
      spellcheck="false"
    ></textarea>

    <div class="buttons">

      <button
        id="printHash"
        class="primary"
      >
        Hash Checkerを印刷 / PDF
      </button>

      <button id="copyCpp">
        C++をコピー
      </button>

    </div>

  </aside>

  <main class="preview-wrap">

    <article
      class="sheet"
      id="sheet"
    ></article>

  </main>

</div>

<script>
"use strict";

const $=id=>document.getElementById(id);

const els={
  title:$("title"),
  description:$("description"),
  source:$("source"),

  blockSize:$("blockSize"),
  fontSize:$("fontSize"),

  cppHash:$("cppHash"),

  update:$("update"),

  printSource:$("printSource"),
  printHash:$("printHash"),

  copyCpp:$("copyCpp"),

  sheet:$("sheet")
};

const encoder=new TextEncoder();

/* ============================================
   Hash
   ============================================ */

const FNV_OFFSET=2166136261;
const FNV_PRIME=16777619;

function isWhitespace(c){
  return (
    c===" "  ||
    c==="\t" ||
    c==="\n" ||
    c==="\r" ||
    c==="\v" ||
    c==="\f"
  );
}

function normalize(s){
  let r="";

  for(const c of s){
    if(!isWhitespace(c))
      r+=c;
  }

  return r;
}

function hashUpdate(h,s){
  const bytes=encoder.encode(s);

  for(const c of bytes){
    h=Math.imul(h^c,FNV_PRIME)>>>0;
  }

  return h;
}

function hash(s){
  return hashUpdate(FNV_OFFSET,s);
}

function hex(x){
  return x
    .toString(16)
    .toUpperCase()
    .padStart(8,"0");
}

/* ============================================
   String utilities
   ============================================ */

function escapeHTML(s){
  return s
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");
}

function splitLines(s){
  s=s.replace(/\r\n?/g,"\n");

  if(s==="")
    return [];

  return s.split("\n");
}

/* ============================================
   Analyze source
   ============================================ */

function analyze(code,K){

  const lines=splitLines(code);
  const blocks=[];

  let prefix=FNV_OFFSET;

  for(let i=0;i<lines.length;i+=K){

    const part=lines.slice(i,i+K);

    /*
      改行自体は空白として無視されるため、
      join("") でも join("\n") でも同じ結果。
    */
    const s=normalize(part.join(""));

    const blockHash=hash(s);

    prefix=hashUpdate(prefix,s);

    blocks.push({
      begin:i+1,
      end:i+part.length,
      lines:part,

      blockHash,
      prefixHash:prefix
    });
  }

  const normalized=normalize(code);

  return {
    lines,
    blocks,
    normalized,
    fullHash:hash(normalized)
  };
}

/* ============================================
   C++ Hash Checker
   ============================================ */

function makeCppHashCode(K){

return `#include <bits/stdc++.h>
using namespace std;
using u32=uint32_t;

int main(){
    constexpr int K=${K};
    constexpr u32 O=2166136261u,P=16777619u;

    u32 h=O,b=O;
    string s;
    int n=0,l=1;

    auto add=[&](u32& x,unsigned char c){
        x=(x^c)*P;
    };

    while(getline(cin,s)){
        ++n;

        for(unsigned char c:s)
            if(!isspace(c))
                add(h,c),add(b,c);

        if(n%K==0){
            printf("%d-%d B:%08X P:%08X\\n",l,n,b,h);
            l=n+1;
            b=O;
        }
    }

    if(n%K)
        printf("%d-%d B:%08X P:%08X\\n",l,n,b,h);
}`;
}

/* ============================================
   Rendering
   ============================================ */

function render(){

  const source=els.source.value;

  const K=Math.max(
    1,
    Math.min(
      100,
      Number(els.blockSize.value)||10
    )
  );

  const fontSize=Math.max(
    5,
    Math.min(
      14,
      Number(els.fontSize.value)||8
    )
  );

  const info=analyze(source,K);

  const cpp=makeCppHashCode(K);

  els.cppHash.value=cpp;

  let html="";

  /* ==========================================
     Library printable area
     ========================================== */

  html+=`
<section id="sourcePrint">

<h1 class="print-title">
${escapeHTML(els.title.value||"Library")}
</h1>

<div class="meta">
lines: ${info.lines.length}
&nbsp;&nbsp;
HASH: ${hex(info.fullHash)}
</div>
`;

  if(els.description.value){

    html+=`
<div class="description">${
  escapeHTML(els.description.value)
}</div>
`;
  }

  for(const b of info.blocks){

    html+=`
<section class="code-block">

<div class="block-head">

<span>
lines ${b.begin}-${b.end}
</span>

<span class="hash">
B:${hex(b.blockHash)}
&nbsp;
P:${hex(b.prefixHash)}
</span>

</div>

<div
  class="lines"
  style="font-size:${fontSize}pt"
>
`;

    b.lines.forEach((line,i)=>{

      html+=`
<div class="code-line">

<span class="ln">
${b.begin+i}
</span>

<span class="src">${
  escapeHTML(line)||" "
}</span>

</div>
`;
    });

    html+=`
</div>
</section>
`;
  }

  html+=`
</section>
`;

  /* ==========================================
     Hash checker printable area
     ========================================== */

  html+=`
<section id="hashPrint">

<h1 class="print-title">
Hash Checker
</h1>

<div class="hash-desc">
標準入力から写経したコードを読み込み、
空白を無視して ${K} 行ごとのハッシュを計算します。
<br>
B = その区間、
P = 先頭からその区間まで。
</div>

<pre class="hash-code">${
  escapeHTML(cpp)
}</pre>

</section>
`;

  els.sheet.innerHTML=html;

  save();
}

/* ============================================
   Local storage
   ============================================ */

const stateKeys=[
  "title",
  "description",
  "source",
  "blockSize",
  "fontSize"
];

function save(){

  const x={};

  for(const k of stateKeys)
    x[k]=els[k].value;

  localStorage.setItem(
    "library-copybook",
    JSON.stringify(x)
  );
}

function load(){

  try{

    const x=JSON.parse(
      localStorage.getItem(
        "library-copybook"
      )
    );

    if(!x)
      return;

    for(const k of stateKeys){

      if(x[k]!=null)
        els[k].value=x[k];
    }

  }catch{}
}

/* ============================================
   Delayed rendering
   ============================================ */

let timer=null;

function lazyRender(){

  clearTimeout(timer);

  timer=setTimeout(
    render,
    100
  );
}

for(const k of stateKeys){

  els[k].addEventListener(
    "input",
    lazyRender
  );
}

/* ============================================
   Buttons
   ============================================ */

els.update.onclick=render;

function clearPrintMode(){

  document.body.classList.remove(
    "print-source",
    "print-hash"
  );
}

function printMode(mode){

  clearPrintMode();

  document.body.classList.add(mode);

  window.print();
}

els.printSource.onclick=()=>{

  render();

  printMode(
    "print-source"
  );
};

els.printHash.onclick=()=>{

  render();

  printMode(
    "print-hash"
  );
};

window.addEventListener(
  "afterprint",
  clearPrintMode
);

els.copyCpp.onclick=async()=>{

  render();

  const text=els.cppHash.value;

  try{

    await navigator.clipboard.writeText(text);

    const old=
      els.copyCpp.textContent;

    els.copyCpp.textContent=
      "コピーしました";

    setTimeout(()=>{
      els.copyCpp.textContent=old;
    },1000);

  }catch{

    els.cppHash.select();

    document.execCommand(
      "copy"
    );
  }
};

/* ============================================
   Init
   ============================================ */

load();
render();

</script>

</body>
</html>
