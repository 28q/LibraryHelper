<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Library Copybook</title>
<style>
*{box-sizing:border-box}
:root{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#18181b;background:#f4f4f5;
}
body{margin:0}
button,input,textarea{font:inherit}
.app{
  display:grid;
  grid-template-columns:minmax(360px,480px) 1fr;
  min-height:100vh;
}
.panel{
  padding:20px;background:white;border-right:1px solid #ddd;
  overflow:auto;height:100vh;position:sticky;top:0;
}
.panel h1{font-size:20px;margin:0 0 18px}
label{
  display:block;font-size:12px;font-weight:700;
  margin:14px 0 5px;
}
input,textarea{
  width:100%;border:1px solid #ccc;border-radius:6px;padding:8px;
}
textarea{
  resize:vertical;
  font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
  font-size:12px;line-height:1.45;tab-size:4;
}
#description{min-height:100px}
#source{min-height:310px}
#cppHash{min-height:340px;background:#fafafa}
.row{display:flex;gap:8px;align-items:end}
.row>div{flex:1}
button{
  border:1px solid #bbb;background:#fafafa;
  border-radius:6px;padding:8px 12px;cursor:pointer;
}
button:hover{background:#eee}
.primary{background:#18181b;color:white;border-color:#18181b}
.primary:hover{background:#333}
.buttons{display:flex;gap:8px;margin-top:15px}
.preview-wrap{padding:25px;overflow:auto}
.sheet{
  width:210mm;min-height:297mm;margin:auto;background:white;
  box-shadow:0 2px 14px #0002;padding:10mm;
}
.print-title{font-size:20pt;margin:0 0 3mm}
.meta{
  font-family:ui-monospace,monospace;
  font-size:8pt;color:#555;margin-bottom:5mm;
}
.description{
  white-space:pre-wrap;font-size:9.5pt;
  line-height:1.55;margin-bottom:6mm;
}
.code-block{
  border-top:1px solid #bbb;
  margin:0;padding:1.2mm 0 1.8mm;
  break-inside:avoid;
}
.block-head{
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  display:flex;justify-content:space-between;gap:8px;
  font-size:7pt;color:#555;margin-bottom:.8mm;
}
.hash{white-space:nowrap;font-weight:700}
.lines{
  font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
  font-size:8pt;line-height:1.32;tab-size:4;
}
.code-line{
  display:grid;
  grid-template-columns:4.5em 1fr;
  min-height:1.32em;
}
.ln{
  text-align:right;padding-right:1em;
  color:#999;user-select:none;
}
.src{white-space:pre;overflow:visible}

.hash-program{
  margin-top:9mm;
  break-before:page;
}
.hash-program h2{
  font-size:15pt;
  margin:0 0 2mm;
}
.hash-program-desc{
  font-size:8.5pt;
  margin-bottom:3mm;
}
.hash-code{
  font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
  white-space:pre-wrap;
  font-size:7.2pt;
  line-height:1.28;
  border:1px solid #bbb;
  padding:3mm;
}

@page{
  size:A4 portrait;
  margin:8mm;
}
@media print{
  body{background:white}
  .panel{display:none!important}
  .app{display:block}
  .preview-wrap{padding:0}
  .sheet{
    width:auto;min-height:0;margin:0;padding:0;box-shadow:none;
  }
}
@media(max-width:900px){
  .app{display:block}
  .panel{
    height:auto;position:static;border-right:0;border-bottom:1px solid #ddd;
  }
}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <h1>Library Copybook</h1>

    <label>ライブラリ名</label>
    <input id="title" value="Library Name">

    <label>説明</label>
    <textarea id="description"
      placeholder="アルゴリズム、使い方、計算量、注意点など"></textarea>

    <div class="row">
      <div>
        <label>チェック間隔</label>
        <input id="blockSize" type="number" min="1" max="100" value="10">
      </div>
      <div>
        <label>コード文字サイズ (pt)</label>
        <input id="fontSize" type="number" min="5" max="14"
               step=".25" value="8">
      </div>
    </div>

    <label>元コード</label>
    <textarea id="source"
      spellcheck="false"
      placeholder="ここにライブラリコードを貼り付け"></textarea>

    <div class="buttons">
      <button id="update">更新</button>
      <button class="primary" id="print">印刷 / PDF</button>
      <button id="copyCpp">C++をコピー</button>
    </div>

    <label>C++ ハッシュ確認コード</label>
    <textarea id="cppHash" readonly spellcheck="false"></textarea>
  </aside>

  <main class="preview-wrap">
    <article class="sheet" id="sheet"></article>
  </main>
</div>

<script>
"use strict";

const $=id=>document.getElementById(id);

const els={
  title:$("title"),
  description:$("description"),
  source:$("source"),
  blockSize:$("blockSize"),
  fontSize:$("fontSize"),
  cppHash:$("cppHash"),
  update:$("update"),
  print:$("print"),
  copyCpp:$("copyCpp"),
  sheet:$("sheet")
};

const encoder=new TextEncoder();

function isAsciiWhitespace(c){
  return c===" "||c==="\t"||c==="\n"||
         c==="\r"||c==="\v"||c==="\f";
}

function normalizeWhitespace(s){
  let r="";
  for(const c of s)
    if(!isAsciiWhitespace(c))r+=c;
  return r;
}

function fnvUpdate(h,s){
  const bytes=encoder.encode(s);
  for(const b of bytes){
    h^=b;
    h=Math.imul(h,0x01000193);
  }
  return h>>>0;
}

function fnv1a(s){
  return fnvUpdate(0x811c9dc5,s);
}

function hex(x){
  return x.toString(16).toUpperCase().padStart(8,"0");
}

function escapeHTML(s){
  return s
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");
}

function splitLines(s){
  s=s.replace(/\r\n?/g,"\n");
  return s===""?[]:s.split("\n");
}

function analyze(code,blockSize){
  const lines=splitLines(code);
  const blocks=[];
  let prefixHash=0x811c9dc5;

  for(let i=0;i<lines.length;i+=blockSize){
    const part=lines.slice(i,i+blockSize);
    const normalized=normalizeWhitespace(part.join("\n"));

    const blockHash=fnv1a(normalized);
    prefixHash=fnvUpdate(prefixHash,normalized);

    blocks.push({
      begin:i+1,
      end:i+part.length,
      lines:part,
      normalized,
      blockHash,
      prefixHash
    });
  }

  const normalized=normalizeWhitespace(code);

  return {
    lines,
    blocks,
    normalized,
    fullHash:fnv1a(normalized)
  };
}

function makeCppHashCode(blockSize){
return `#include <bits/stdc++.h>
using namespace std;

using u32 = uint32_t;

static constexpr int BLOCK = ${blockSize};
static constexpr u32 FNV_OFFSET = 0x811C9DC5u;
static constexpr u32 FNV_PRIME  = 0x01000193u;

static inline bool is_ws(unsigned char c){
    return c==' ' || c=='\\\\t' || c=='\\\\n' ||
           c=='\\\\r' || c=='\\\\v' || c=='\\\\f';
}

static inline void fnv_add(u32& h,unsigned char c){
    h^=c;
    h*=FNV_PRIME;
}

static string hex8(u32 x){
    static const char d[]="0123456789ABCDEF";
    string s(8,'0');
    for(int i=7;i>=0;--i){
        s[i]=d[x&15];
        x>>=4;
    }
    return s;
}

int main(){
    ios::sync_with_stdio(false);
    cin.tie(nullptr);

    string src(
        (istreambuf_iterator<char>(cin)),
        istreambuf_iterator<char>()
    );

    // CRLF / CR を LF に統一
    string s;
    s.reserve(src.size());

    for(size_t i=0;i<src.size();++i){
        if(src[i]=='\\\\r'){
            if(i+1<src.size() && src[i+1]=='\\\\n') ++i;
            s.push_back('\\\\n');
        }else{
            s.push_back(src[i]);
        }
    }

    // JS の split("\\\\n") と同じように、末尾空行も保持
    vector<string> lines;

    if(!s.empty()){
        size_t p=0;
        while(true){
            size_t q=s.find('\\\\n',p);

            if(q==string::npos){
                lines.emplace_back(s.substr(p));
                break;
            }

            lines.emplace_back(s.substr(p,q-p));
            p=q+1;

            if(p==s.size()){
                lines.emplace_back("");
                break;
            }
        }
    }

    u32 prefix=FNV_OFFSET;
    u32 full=FNV_OFFSET;

    size_t normalized_chars=0;

    for(int base=0;base<(int)lines.size();base+=BLOCK){
        u32 block=FNV_OFFSET;

        int end=min<int>(base+BLOCK,lines.size());

        for(int i=base;i<end;++i){
            for(unsigned char c:lines[i]){
                if(is_ws(c)) continue;

                fnv_add(block,c);
                fnv_add(prefix,c);

                ++normalized_chars;
            }
        }

        cout
            <<"lines "<<base+1<<"-"<<end
            <<"  B:"<<hex8(block)
            <<"  P:"<<hex8(prefix)
            <<"\\\\n";
    }

    for(unsigned char c:src){
        if(is_ws(c)) continue;
        fnv_add(full,c);
    }

    cout<<"\\\\n";
    cout<<"HASH: "<<hex8(full)<<"\\\\n";
    cout<<"normalized bytes: "<<normalized_chars<<"\\\\n";
}`;
}

function render(){
  const source=els.source.value;
  const blockSize=Math.max(1,+els.blockSize.value||10);
  const fontSize=Math.max(5,+els.fontSize.value||8);

  const info=analyze(source,blockSize);
  const cppCode=makeCppHashCode(blockSize);

  els.cppHash.value=cppCode;

  let html=`
    <h1 class="print-title">${escapeHTML(els.title.value||"Library")}</h1>

    <div class="meta">
      lines: ${info.lines.length}
      &nbsp;
      normalized bytes: ${encoder.encode(info.normalized).length}
      &nbsp;
      HASH: ${hex(info.fullHash)}
    </div>
  `;

  if(els.description.value){
    html+=`
      <section class="description">${
        escapeHTML(els.description.value)
      }</section>
    `;
  }

  info.blocks.forEach(b=>{
    html+=`
      <section class="code-block">
        <div class="block-head">
          <span>lines ${b.begin}-${b.end}</span>
          <span class="hash">
            B:${hex(b.blockHash)}
            &nbsp;
            P:${hex(b.prefixHash)}
          </span>
        </div>

        <div class="lines" style="font-size:${fontSize}pt">
    `;

    b.lines.forEach((line,j)=>{
      html+=`
        <div class="code-line">
          <span class="ln">${b.begin+j}</span>
          <span class="src">${escapeHTML(line)||" "}</span>
        </div>
      `;
    });

    html+=`
        </div>
      </section>
    `;
  });

  html+=`
    <section class="hash-program">
      <h2>Hash Checker (C++)</h2>

      <div class="hash-program-desc">
        標準入力から写経したコードを読み込み、
        ASCII空白を無視して ${blockSize} 行ごとの B / P ハッシュを計算する。
      </div>

      <pre class="hash-code">${escapeHTML(cppCode)}</pre>
    </section>
  `;

  els.sheet.innerHTML=html;

  save();
}

const stateKeys=[
  "title",
  "description",
  "source",
  "blockSize",
  "fontSize"
];

function save(){
  const obj={};
  for(const k of stateKeys)obj[k]=els[k].value;
  localStorage.setItem("library-copybook",JSON.stringify(obj));
}

function load(){
  try{
    const obj=JSON.parse(
      localStorage.getItem("library-copybook")
    );
    if(!obj)return;

    for(const k of stateKeys){
      if(obj[k]!=null)els[k].value=obj[k];
    }
  }catch{}
}

let timer=null;

function lazyRender(){
  clearTimeout(timer);
  timer=setTimeout(render,100);
}

for(const k of stateKeys)
  els[k].addEventListener("input",lazyRender);

els.update.onclick=render;

els.print.onclick=()=>{
  render();
  window.print();
};

els.copyCpp.onclick=async()=>{
  render();

  try{
    await navigator.clipboard.writeText(els.cppHash.value);

    const old=els.copyCpp.textContent;
    els.copyCpp.textContent="コピーしました";

    setTimeout(()=>{
      els.copyCpp.textContent=old;
    },1000);
  }catch{
    els.cppHash.select();
    document.execCommand("copy");
  }
};

load();
render();
</script>
</body>
</html>
